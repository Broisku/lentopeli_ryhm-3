<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link href="css/style_game.css" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin="" defer></script>
    <script src="js/main.js" defer></script>
    <title>Airport Tycoon</title>
</head>
<body>
    <header>
        <ul id="header-ul">
            <li>Name: <span id="player_name"></span></li>
            <li>Money: <span id="money">0</span></li>
            <li>Profit: <span id="profit">0</span></li>
            <li>Week: <span id="time">0</span></li>
            <li><a id="menu" href="index.html">Main Menu</a></li>
        </ul>
    </header>
    <div id="map">
        <div id="map-toggle-buttons">
            <button class="toggleBtn" id="toggle1" title="Näytä vain omistamat lentokentät">1</button>
            <button class="toggleBtn" id="toggle2" title="Näytä vain lentokentät, joihin on varaa">2</button>
        </div>
        <div id="speed-buttons">
            <button class="speedBtn pause" id="pause" title="Pausettaa pelin"></button>
            <button class="speedBtn normal" id="speed"></button>
        </div>
    </div>
</body>
</html>
